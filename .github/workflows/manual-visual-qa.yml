name: Manual visual QA

on:
  push:
    branches:
      - ui/comprehensive-review-and-improvements

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 20
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production application
        run: npm run build
        env:
          GATEWAY_BASE_URL: https://example.invalid
          CLIPROXY_API_KEY: qa-placeholder
          HOME_GATEWAY_SECRET: qa-placeholder
          DEFAULT_GATEWAY_MODEL: gpt-5.6-terra
          ALLOWED_GATEWAY_MODELS: gpt-5.6-terra
          VISION_GATEWAY_MODELS: gpt-5.6-terra
          REASONING_GATEWAY_MODELS: gpt-5.6-terra
      - name: Capture cross-browser states
        run: npx playwright test e2e/manual-visual-review.spec.ts --project=chromium --project=firefox --project=webkit --workers=1
        env:
          PLAYWRIGHT_PRODUCTION: "1"
          GATEWAY_BASE_URL: https://example.invalid
          CLIPROXY_API_KEY: qa-placeholder
          HOME_GATEWAY_SECRET: qa-placeholder
          DEFAULT_GATEWAY_MODEL: gpt-5.6-terra
          ALLOWED_GATEWAY_MODELS: gpt-5.6-terra
          VISION_GATEWAY_MODELS: gpt-5.6-terra
          REASONING_GATEWAY_MODELS: gpt-5.6-terra
      - name: Upload visual review artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manual-visual-qa
          path: |
            manual-qa/
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 7
