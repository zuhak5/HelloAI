name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
        env:
          GATEWAY_BASE_URL: https://example.invalid
          CLIPROXY_API_KEY: ci-placeholder
          HOME_GATEWAY_SECRET: ci-placeholder
          DEFAULT_GATEWAY_MODEL: gpt-5.6-terra
          ALLOWED_GATEWAY_MODELS: gpt-5.6-terra
          VISION_GATEWAY_MODELS: gpt-5.6-terra
          REASONING_GATEWAY_MODELS: gpt-5.6-terra

  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 35
    needs: validate
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Playwright runtime version
        run: |
          node -e "const version = require('./node_modules/@playwright/test/package.json').version; if (version !== '1.62.1') throw new Error('Update the Playwright CI image to v' + version)"
        shell: bash
      - name: Build production application
        run: npm run build
        env:
          GATEWAY_BASE_URL: https://example.invalid
          CLIPROXY_API_KEY: ci-placeholder
          HOME_GATEWAY_SECRET: ci-placeholder
          DEFAULT_GATEWAY_MODEL: gpt-5.6-terra
          ALLOWED_GATEWAY_MODELS: gpt-5.6-terra
          VISION_GATEWAY_MODELS: gpt-5.6-terra
          REASONING_GATEWAY_MODELS: gpt-5.6-terra
      - name: Cross-browser and PWA end-to-end tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_PRODUCTION: "1"
          GATEWAY_BASE_URL: https://example.invalid
          CLIPROXY_API_KEY: ci-placeholder
          HOME_GATEWAY_SECRET: ci-placeholder
          DEFAULT_GATEWAY_MODEL: gpt-5.6-terra
          ALLOWED_GATEWAY_MODELS: gpt-5.6-terra
          VISION_GATEWAY_MODELS: gpt-5.6-terra
          REASONING_GATEWAY_MODELS: gpt-5.6-terra
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
