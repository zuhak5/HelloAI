name: Apply UI review follow-up

on:
  push:
    branches:
      - ui/comprehensive-review-and-improvements

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/comprehensive-review-and-improvements
      - name: Apply follow-up
        run: python scripts/apply-ui-review-followup.py
      - name: Review diff
        run: |
          git diff --check
          git diff --stat
      - name: Commit follow-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UI_IMPROVEMENT_IMPLEMENTATION_PLAN.md components/HelloAIApp.tsx
          git commit -m "fix(ui): discard stale image preparation results"
          git push origin HEAD:ui/comprehensive-review-and-improvements
