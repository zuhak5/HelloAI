<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0d12" />
    <title>HelloAI is offline</title>
    <style>
      :root { color-scheme: dark; background: #0b0d12; color: #f4f7fb; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 560px); border: 1px solid #252a34; border-radius: 20px; background: #11151c; padding: 28px; box-sizing: border-box; }
      h1 { margin: 0 0 12px; font-size: clamp(1.7rem, 5vw, 2.4rem); }
      p { color: #b8c0cc; line-height: 1.6; }
      a { display: inline-block; margin-top: 10px; border-radius: 12px; background: #f4f7fb; color: #0b0d12; padding: 11px 16px; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>HelloAI is offline</h1>
      <p>Your device-local conversations remain stored on this device. The installed application can open cached conversations while offline, but new AI responses require a network connection.</p>
      <a href="/">Open local chats</a>
    </main>
  </body>
</html>
